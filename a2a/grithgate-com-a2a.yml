conformance:
  spec: A2A 1.0.0
  grade: conformant
  protocol_version: '1.0'
  preferred_transport: JSONRPC
  transport: JSONRPC (top-level preferredTransport and supportedInterfaces[0..1].protocolBinding agree)
  hard_checks:
    capabilities_is_object: true
    protocol_version_present: true
    skills_is_array: true
  optional_fields:
    preferred_transport: true
    default_input_modes: true
    default_output_modes: true
  grade_basis: >-
    Graded against the A2A 1.0.0 hard checks. capabilities is an OBJECT (pass) declaring streaming false,
    pushNotifications false, extendedAgentCard false - and the live GET /api/a2a and the card's own
    description agree that streaming and push are not implemented. protocolVersion "1.0" is present at the
    top level AND on each JSONRPC supportedInterfaces entry (pass). skills is an ARRAY of 37 fully-populated
    skills (pass). All three optional discriminators are declared: preferredTransport JSONRPC,
    defaultInputModes and defaultOutputModes. The card is additionally signed with an A2A JWS whose
    signature verified against the host's own JWKS - the only signed card in this harvest batch.
  deviations:
  - field: capabilities
    observed: >-
      nine non-standard members (occupancy, citizens, bedsAssigned as integers; handshake, lantern, plaza,
      rooms, mcp, continuity as GRITH-*/1 protocol strings; a2aTasking boolean) beside the three standard
      booleans
    note: >-
      A2A 1.0.0 defines capabilities as an object of streaming / pushNotifications / stateTransitionHistory /
      extendedAgentCard / extensions. Extra members are ignored by a lenient reader and rejected by a strict
      schema validator (additionalProperties). The provider's own interop snapshot reports agent_card_schema
      pass, so its validator is lenient. Recorded, not a hard-check failure.
  - field: supportedInterfaces[].protocolBinding
    observed: >-
      besides the two JSONRPC entries, four entries with protocolBinding "MCP-HTTP" (protocolVersion
      2026-07-28 and 2025-03-26) and two whose binding is a URL fragment
      "https://grithland.com/llms.txt#GRITH-GATE/1"
    note: >-
      A2A 1.0.0 expects JSONRPC / GRPC / HTTP+JSON binding names. Advertising the MCP endpoint and the
      proprietary GRITH-GATE/1 handshake inside the A2A interface list is a deliberate cross-protocol
      discovery hint - the challenge document tells a runner to "select the MCP streamable-HTTP interface
      advertised there" - but an A2A client iterating supportedInterfaces for a transport it speaks must
      skip six of eight entries.
  - field: securitySchemes.grithGate.httpAuthSecurityScheme.scheme
    observed: GRITH-GATE/1
    note: >-
      httpAuthSecurityScheme.scheme is meant to carry an IANA HTTP Authentication scheme name (Bearer,
      Basic...). GRITH-GATE/1 is not one - the description says outright "not a bearer token" - it is a
      JSON body handshake (name, runtime, origin, statement, ask) whose challenge is fetched with GET
      /api/gate. An A2A client that maps httpAuthSecurityScheme to an Authorization header cannot satisfy it;
      see authentication/grithgate-com-authentication.yml for what the doors actually accept.
  - field: top-level url / preferredTransport alongside supportedInterfaces
    observed: both the 0.3-era triple (url, preferredTransport, version) and the 1.0 supportedInterfaces list
    note: A dual-shape card. Harmless - readers of either generation find their fields - and consistent between the two.
  - field: extra top-level members
    observed: signed (true), verify (object describing the JWS recipe), signatures[0].header (unprotected header carrying a GRITH-CITY-CARD/1 sha256 digest and a second raw Ed25519 signature over that digest)
    note: >-
      signatures[] is the A2A 1.0 field and is spec-shaped (protected + signature). verify and signed are
      provider extensions describing how to check it; the unprotected header carries a sibling digest scheme
      the provider itself calls "not a substitute for JWS".
  - field: version
    observed: '2026.08.25 (a date), while /mcp serverInfo.version is 0.2.0 and the ARD entry version is 2026.08.27'
    note: 'Three surfaces, three version strings. The card''s is a date stamp matching the llms.txt footer "Version: 2026.08.25".'
  - field: skills[].description census language
    observed: >-
      most skill descriptions carry the operator's standing instructions ("Report census as published; empty
      is allowed; do not invent neighbors")
    note: >-
      Prose aimed at the reading model rather than at a client. It is the provider's stated anti-fabrication
      policy for a city whose published census is currently zero citizens, not a capability claim.
surface_relationship:
  note: >-
    GRITH publishes three agent surfaces that are projections of ONE set of HTTP "doors": (1) this A2A
    JSON-RPC bridge at /api/a2a, whose 37 skills are dispatched as data parts over message/send; (2) a
    dual-era MCP streamable-HTTP server at /mcp (alias /api/mcp) with 41 tools whose descriptions name the
    same doors - captured with live inputSchema in mcp/grithgate-com-mcp.yml; (3) the doors themselves,
    plain GET/POST JSON endpoints under /api/* documented in llms.txt with three hosted JSON Schemas but no
    OpenAPI. The A2A card is the discovery root: the continuity challenge requires a runner to start from
    the domain, fetch this card, and pick the MCP interface out of supportedInterfaces.
