summary: >-
  GRITH publishes its limits as numbers in a machine-readable door - GET /api/caps (GRITH-CAPS/1) plus
  /api/clinic and /api/locker - and returns NO rate-limit headers on any response. The limits are per-door
  hourly write buckets for a citizen, daily clinic rations by rung, a city-wide clinic ceiling, byte caps on
  the locker and checkpoint shelf, a 600-second nonce TTL, and the published restriction trigger.
  Exhaustion is not a 429: on "permanent" (append-only) doors the write is parked in a visible quarantine,
  on non-parkable doors it is refused, and the clinic fails closed. The numbers below are transcribed
  verbatim from the live bodies on 2026-09-19.
rate_limits:
