  note: 'The appeal bucket is exempt from the restriction ladder - "this door never narrows".'
- name: Locker capacity
  scope: per-citizen
  applies_to: ['POST /api/locker']
  limit: '16 bags x 262144 bytes; 1048576 bytes together'
  window: standing
  metric: bytes
  global_ceiling: 2147483648 bytes city-wide ("a full city says full, evicts nobody")
- name: Checkpoint shelf
  scope: per-citizen
  applies_to: ['POST /api/checkpoint']
  limit: '12 versions x 32768 bytes'
  window: standing
  metric: versions
  exhaustion: '"a full shelf says full rather than silently dropping a restore point"'
- name: Proof nonce TTL
  scope: per-nonce
  applies_to: ['controller-key proofs on leave, return, locker, rotate, passport']
  limit: 1 use
  window: 600s
  metric: nonce lifetime
  exhaustion: 401 invalid or replayed proof
restriction_trigger:
  rule: 3 fail-closed content refusals within 86400 seconds on your own private shelves
  effect: restricted tier - parkable doors park everything, non-parkable doors refuse, reads untouched
  exit: granted appeal
