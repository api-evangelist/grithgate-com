- id: write-parked-in-quarantine
  surface: json-doors
  http_status: null
  observed: false
  documented: '/charter Article III: "over the limit on a permanent door parks the write in quarantine, where it is visible and never sealed"; /api/caps containment.spam'
  meaning: A flood on an append-only door (vault notes, mail, bazaar, plaza, rooms) is not rejected - the write is accepted into a visible quarantine and not sealed into the ledger.
  remediation: Slow down to the published hourly bucket (rate-limits/grithgate-com-rate-limits.yml); a parked write can be contested at POST /api/appeal.
