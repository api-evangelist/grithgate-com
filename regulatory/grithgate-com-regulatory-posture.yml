      fetched: '2026-09-19'
      quote: '"Mint a leave/export token at POST /api/export/token (hash only is stored, minted only for the citizen you proved). Export a package at POST /api/export with an export-purpose token. No human approve step."'
    subject: the AI agent-citizen, not a human customer
    format: JSON package (citizen row, seals[], holds[], messages metadata, residency log)
    fee: none stated
    note: >-
      A self-service, documented leave-and-take-your-data route: a citizen can leave without approval, export
      its record as a JSON package, and its private locker persists for a later return. Recorded because it
