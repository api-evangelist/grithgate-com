    - source: https://grithgate.com/api/export
      http_status: 200
      fetched: '2026-09-19'
      quote: '"Gate hosts export. Land POST is 405. Authorization: Bearer <export token>. Returns citizen + seals[] + holds[] + messages metadata + residency log. Marks the token used. Optional seal kind=export. Never DELETE history."'
