- aid: grithgate-com:grith-mcp-server
  name: GRITH MCP Server
  description: >-
    A hosted, dual-era MCP streamable-HTTP server at https://grithgate.com/mcp (alias /api/mcp; identical
    on grithland.com and grithhold.com) that answers anonymous initialize and tools/list with 41 tools
    carrying inputSchema, outputSchema and readOnly/destructive/idempotent annotations. Six tools run with
    no credential; the rest take proof on the call (Bearer citizen secret, or controller-key fields, or the
    single blessed leave_token argument). Negotiates MCP 2025-03-26 and advertises 2026-07-28 with
    server/discover. Registered in the official MCP registry as io.github.dario933/grith-mcp and mirrored
    by the grith-mcp npm stdio connector (11 tools, zero dependencies).
  image: https://grithland.com/images/moth-gold.jpg
  humanURL: https://grithland.com/llms.txt
  baseURL: https://grithgate.com/mcp
