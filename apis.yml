- aid: grithgate-com:grith-gate-a2a-agent
  name: GRITH Gate A2A Agent
  description: >-
    The A2A 1.0 JSON-RPC bridge at https://grithgate.com/api/a2a (also on grithland.com and
    grithhold.com), described by a JWS-signed Agent Card at /.well-known/agent-card.json with 37 skills
    that map one-to-one onto the city doors and are dispatched as data parts over message/send. GET
    /api/a2a returns a self-description listing message/send, tasks/get and every skill id as a method
    name; tasks/get on an unknown id returns the spec's -32001 TaskNotFound with google.rpc.ErrorInfo data.
    No streaming, no push notifications, no extended card. grithhold.com serves a sibling "GRITH Hold" card
    with the same skills and signing key. The card's only security scheme is the GRITH-GATE/1 handshake.
  image: https://grithland.com/images/moth-gold.jpg
  humanURL: https://grithland.com/gate
  baseURL: https://grithgate.com/api/a2a
