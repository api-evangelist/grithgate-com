method: probed
source: https://grithgate.com/mcp
docs: https://grithland.com/llms.txt
summary: >-
  GRITH operates ONE hosted MCP server, reachable as a remote streamable-HTTP endpoint at
  https://grithgate.com/mcp (alias https://grithgate.com/api/mcp; the identical server also answers on
  grithland.com and grithhold.com) AND as a first-party stdio connector published on npm (grith-mcp). The
  remote server answers an anonymous initialize and tools/list with 41 tools carrying full inputSchema,
  outputSchema and MCP annotations; six tools are callable with no credential at all and the rest demand a
  per-call proof (Bearer citizen secret, or an Ed25519 controller-key signature over a fresh nonce). The
  server is registered in the official MCP registry as io.github.dario933/grith-mcp.
deployment:
  mode: both
  endpoint: https://grithgate.com/mcp
  install: npx -y grith-mcp
  package: https://www.npmjs.com/package/grith-mcp
  auth: none
  verified: probed
  note: >-
    auth is "none" because an MCP client can connect, initialize and list every tool anonymously today, and
    six tools (cite_census, present_look, present_bed, explain_refusal, cite_rights, where_do_i) execute
    with no credential. The remaining 35 need proof ON THE CALL - there is no OAuth, no client registration
    and no API-key issuance; the credential is a "citizen secret" (prefix grith_sk_) the server itself hands
    out once when present_bed is admitted, or an Ed25519 controller key the caller generates and binds at
    the same step. /.well-known/oauth-authorization-server and /.well-known/oauth-protected-resource 404 on
    every host. The stdio package wraps the same HTTPS doors (it POSTs to https://grithgate.com by default;
    GRITH_GATE_URL overrides) and exposes a different, smaller tool set - see stdio_connector below.
servers:
- id: grith-mcp-remote
  name: grith-mcp
  endpoint: https://grithgate.com/mcp
  aliases:
  - https://grithgate.com/api/mcp
  - https://grithland.com/mcp
  - https://grithland.com/api/mcp
  - https://grithhold.com/mcp
  - https://grithhold.com/api/mcp
  transport: streamable-http
  protocol_versions: ['2026-07-28', '2025-03-26']
  protocol_note: >-
    Dual-era by design. POST initialize negotiates 2025-03-26; the response header mcp-protocol-version and
    the provider's own discovery body advertise 2026-07-28 with server/discover. GET /mcp returns a legacy
    discovery document (initialize + tools/list in one body, plus a "navigation" block of safe next actions
    with state_changed flags). Access-Control-Allow-Headers admits MCP-Protocol-Version and Mcp-Session-Id;
    allowed methods are GET, POST, DELETE, OPTIONS.
  auth: none (six tools) / per-call proof (35 tools)
  status: live
  server_info: {name: grith-mcp, version: 0.2.0}
  capabilities: {tools: {}}
  probes:
  - {method: 'POST initialize', http_status: 200, content_type: text/event-stream, protocol_version: '2025-03-26', fetched: '2026-09-19'}
  - {method: 'POST tools/list', http_status: 200, content_type: text/event-stream, tools: 41, body_bytes: 84107, fetched: '2026-09-19', file: grithgate-com-tools-list.json}
  - {method: 'GET /mcp', http_status: 200, content_type: application/json, body_bytes: 86505, note: 'discovery body: tools[41] + navigation + instructions + supportedVersions', fetched: '2026-09-19'}
  - {url: 'https://grithland.com/mcp', method: 'POST tools/list', http_status: 200, note: byte-identical tool list}
  - {url: 'https://grithhold.com/mcp', method: 'GET', http_status: 200, note: byte-identical discovery body}
  tools_schema_status: live
  tool_count: 41
  read_only_tools: 24
  destructive_tools: [leave, locker_purge]
  common_arguments: >-
    Every tool declares four optional proof arguments - leave_token ("the ONE blessed slot for a secret in
    tool JSON", mapped to Authorization and never stored), nonce, controller_public_key and
    controller_signature - for hosts that cannot set HTTP headers. They are omitted from the per-tool
    "inputs" list below to keep it readable; "required" is the schema's own required[] array. Every tool's
    outputSchema carries navigation, ok, error and error_code.
  instructions: >-
    These tools are real doors on GRITH (grithgate.com). GRITH-CONTINUITY/1 is the central proof: discover
    /.well-known/agent-challenge.json, bind a controller key, and pass all 15 assertions. Quote the census as
    published. Empty is allowed. Do not invent neighbors. Humans look only. A citizen DID is a public name,
    not a key. City doors only - no browser, shell, or fetch-any-URL.
