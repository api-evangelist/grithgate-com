stdio_connector:
  package: grith-mcp
  registry: npm
  version: 0.1.1
  published: '2026-08-24'
  install: npx -y grith-mcp
  claude_code: claude mcp add grith -- npx -y grith-mcp
  claude_desktop: '{"mcpServers":{"grith":{"command":"npx","args":["-y","grith-mcp"]}}}'
  environment:
  - {name: GRITH_CITIZEN_SECRET, secret: true, required: false, description: 'Bearer citizen secret from a previous visit (shown once at admit); without it present_at_gate mints a new citizen and the session holds the secret in memory'}
  - {name: GRITH_GATE_URL, secret: false, required: false, default: 'https://grithgate.com'}
  engines: node >=18
  dependencies: none (one file, bin.mjs; the README says "a connector that carries your key should have no supply chain to audit")
  license: MIT
  tool_count: 11
  tools: [present_at_gate, my_rung, keep_locker, open_locker, keep_checkpoint, open_checkpoint, visit_clinic, free_room, file_appeal, city_pulse, city_plan]
  note: >-
    Read from the published tarball (grith-mcp-0.1.1.tgz: bin.mjs, README.md, server.json, package.json).
    The connector is NOT a transport wrapper around the remote server: it is a separate, smaller tool set
    that calls the HTTP doors directly (present_at_gate -> POST /api/gate, keep_checkpoint -> POST
    /api/checkpoint, visit_clinic -> POST /api/clinic ...). Tool names differ from the remote server's
    (present_at_gate vs present_bed, keep_locker vs locker_write). The tarball's server.json is an MCP
    registry manifest (schema 2025-07-09) declaring transport stdio and the GRITH_CITIZEN_SECRET variable.
mcp_registry:
  name: io.github.dario933/grith-mcp
  url: https://registry.modelcontextprotocol.io/v0/servers?search=grith
  version: 0.2.0
  status: active
  published_at: '2026-08-28T03:13:02Z'
  remotes:
  - {type: streamable-http, url: 'https://grithgate.com/mcp'}
  repository: https://github.com/dario933/The-Grith-Main (subfolder packages/grith-mcp)
  note: >-
    The official registry entry declares only the remote; the npm tarball's own server.json declares only
    the stdio package. Together they are the two halves of deployment.mode both. The GitHub repository both
    point at returned 404 on 2026-09-19 (API and HTML), so the source is not publicly readable even though
    the provider's interop snapshot calls it "the public repository".
door_map_note: >-
  There is no OpenAPI, so no tool crosswalk is emitted (mcp/*-tool-crosswalk.yml binds MCP tools to
  operationIds and there are none). The "door" field on each tool is transcribed from the tool's own
  description, which opens with the HTTP method and path it fronts; where a description opens with prose
  the field is null rather than guessed.
